<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#fff8f8">
    <meta name="description" content="Support Spare the Tatas and our event with a secure donation.">
    <title>Spare the Tatas | Support Our Event</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="page-shell">
      <section class="donation-card" aria-labelledby="charity-name">
        <span class="heart-mark" aria-hidden="true">♥</span>
        <p class="eyebrow">A little kindness goes a long way</p>
        <h1 id="charity-name">Spare the <span>Tatas</span></h1>
        <p class="intro">Your support helps make our event possible. Choose the way that works best for you.</p>

        <div class="payment-options" aria-label="Payment options">
          <a class="payment-button stripe-button" href="https://paypal.me/sparethetatas">
            <span class="button-icon" aria-hidden="true">♡</span>
            <span>Pay with Apple Pay / Card</span>
            <span class="button-arrow" aria-hidden="true">&#8599;</span>
          </a>
          <a class="payment-button venmo-button" href="https://venmo.com/sparethetatas?txn=pay">
            <span class="button-icon venmo-icon" aria-hidden="true">V</span>
            <span>Pay with Venmo</span>
            <span class="button-arrow" aria-hidden="true">&#8599;</span>
          </a>
        </div>

        <p class="secure-note"><span aria-hidden="true">✦</span> Every contribution means so much</p>
      </section>

      <footer>Thank you for supporting our event!</footer>
    </main>
  </body>
</html>
